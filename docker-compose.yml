services:
  backend:
    build: ./backend
    container_name: ce50-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend/ce50.db:/app/ce50.db
      - ./backend/uploads:/app/uploads
    environment:
      - GNEWS_API_KEY=${GNEWS_API_KEY}

  frontend:
    build: ./frontend
    container_name: ce50-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: ce50-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    profiles:
      - tunnel
    depends_on:
      - frontend
      - backend
